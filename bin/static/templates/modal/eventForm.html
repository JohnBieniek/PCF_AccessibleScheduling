<div class="modal-header">
    <h3 ng-show="eventAction === 'add'">Add a event</h3>
    <h3 ng-show="eventAction === 'update'">Edit a event</h3>
</div>

<div class="modal-body">
    <form name="eventForm" role="form">
        <div class="form-group has-feedback" ng-class="{'has-warning': eventForm.name.$invalid, 'has-success': eventForm.name.$valid}">
            <label for="name" style="font-size:18px">Event Name</label>
            <input type="text" class="form-control input-large" id="name" name="name" required ng-model="event.name">
            <span class="glyphicon form-control-feedback" ng-class="{'glyphicon-warning-sign': eventForm.name.$invalid, 'glyphicon-ok': eventForm.name.$valid}"></span>
        </div>
        
        <div class="form-group has-feedback" ng-class="{'has-warning': eventForm.requestedStaff.$invalid, 'has-success': eventForm.requestedStaff.$valid}">
            <label for="requestStaff" style="font-size:18px">Requested Staff</label>
            <input type="text" class="form-control input-large" id="requestStaff" name="requestedStaff" required ng-model="event.requestedStaff">
            <span class="glyphicon form-control-feedback" ng-class="{'glyphicon-warning-sign': eventForm.requestedStaff.$invalid, 'glyphicon-ok': eventForm.requestedStaff.$valid}"></span>
        </div>
        
        <div>
            <label for="startDate" style="font-size:18px">Start Date/Time</label>
            <input type="date" ng-model="event.startDate" placeholder="Date" ng-required/>
            <input type="time" ng-model="event.startTime">
        </div>
        
        <div>
            <label for="endDate" style="font-size:18px">End Date/Time</label>
            <input type="date" ng-model="event.endDate" placeholder="Date" ng-required/>
            <input type="time" ng-model="event.endTime">
        </div>
    </form>
</div>

<div class="modal-footer">
    <button class="btn btn-primary btn-md active" ng-disabled="eventForm.$invalid" ng-class="{ 'disabled': eventform.$invalid }" ng-click="ok()" >OK</button>
    <button class="btn btn-warning btn-md active" ng-click="cancel()">Cancel</button>
</div>
