<div ng-controller="SchedulingController" ng-init="listStatusItems()">
	<divstyle="display:inline-block;">
	 	<div style="display:inline-block;">
			<ul>
				<div class="monthSelector">
					<div class = "myTab" ng-class="{ active: isSet(1) , generated: isTabGenerated(1), assigned: isTabAssigned(1), working: isWorking(1) }">
				    	<div >
				       		<p ng-click="setTab(1)">Jan</p>
				    	</div>
			    	</div>
			    	<div class = "myTab" ng-class="{ active: isSet(2), generated: isTabGenerated(2), assigned: isTabAssigned(2), working: isWorking(2) }">
			    		<div >
					       	<p ng-click="setTab(2)">Feb</p>
				    	</div>
			    	</div>
			    	<div class = "myTab" ng-class="{ active: isSet(3), generated: isTabGenerated(3), assigned: isTabAssigned(3), working: isWorking(3) }">
			    		<div >
					       	<p ng-click="setTab(3)">Mar</p>
				    	</div>
			    	</div>
			    	<div class = "myTab" ng-class="{ active: isSet(4), generated: isTabGenerated(4), assigned: isTabAssigned(4), working: isWorking(4) }">
			    		<div >
					       	<p ng-click="setTab(4)">Apr</p>
				    	</div>
			    	</div>
			    	<div class = "myTab" ng-class="{ active: isSet(5), generated: isTabGenerated(5), assigned: isTabAssigned(5), working: isWorking(5) }">
			    		<div>
					       	<p ng-click="setTab(5)">May</p>
				    	</div>
			    	</div>
			    	<div class = "myTab" ng-class="{ active: isSet(6), generated: isTabGenerated(6), assigned: isTabAssigned(6), working: isWorking(6) }">
			    		<div >
					       	<p ng-click="setTab(6)">Jun</p>
				    	</div>
			    	</div>
			    	<div class = "myTab" ng-class="{ active: isSet(7), generated: isTabGenerated(7), assigned: isTabAssigned(7), working: isWorking(7) }">
			    		<div >
					       	<p ng-click="setTab(7)">Jul</p>
				    	</div>
			    	</div>
			    	<div class = "myTab" ng-class="{ active: isSet(8), generated: isTabGenerated(8), assigned: isTabAssigned(8), working: isWorking(8) }">
			    		<div >
					       	<p href ng-click="setTab(8)">Aug</p>
				    	</div>
			    	</div>
			    	<div class = "myTab" ng-class="{ active: isSet(9), generated: isTabGenerated(9), assigned: isTabAssigned(9), working: isWorking(9) }">
			    		<div >
					       	<p href ng-click="setTab(9)">Sep</p>
				    	</div>
			    	</div>
			    	<div class = "myTab" ng-class="{ active: isSet(10), generated: isTabGenerated(10), assigned: isTabAssigned(10), working: isWorking(10) }">
			    		<div >
					       	<p ng-click="setTab(10)">Oct</p>
				    	</div>
			    	</div>
			    	<div class = "myTab" ng-class="{ active: isSet(11), generated: isTabGenerated(11), assigned: isTabAssigned(11), working: isWorking(11) }">
			    		<div >
			    		   	<p ng-click="setTab(11)">Nov</p>
			    		</div>
			    	</div>
			    	<div class = "myTab" ng-class="{ active: isSet(12), generated: isTabGenerated(12), assigned: isTabAssigned(12),working: isWorking(12) }">
			    		<div >
					       	<p ng-click="setTab(12)">Dec</p>
				    	</div>
			    	</div>
		    	</div>
	    	</ul>
	   	</div>
	   	<div style="display:inline-block; vertical-align: top; width:70%">
			<div class="scheduler" >
				<h2 style="font-size:45px">{{monthName}}</h2>
				<br>
				<div style="display:inline-block">
					<div style="display:inline-block" class = "incomplete" ng-class="{ complete: isGenerated(tab) }">
						<p style="display:inline-block"> <b> {{generated}} </b> </p>
					</div>
					<div class = "incomplete" style="display:inline-block" ng-class="{ complete: isAssigned(tab), working: isAssigning(tab), errored: isErrored(tab) }">
						<p align="right"   style="display:inline-block"> <b> {{assigned}} </b> </p>
					</div>
				</div>
					<br>
					<br>
					<br>
				<button class="scheduleButton" ng-class="{ disabled: isGenerated(tab) }" type="button" ng-click="generateShifts(tab)">Generate</button>
				
				<button align="right" ng-class="{ disabled:  !isGenerated(tab) || isAssigning(tab) ||  isAssigned(tab)}" class="scheduleButton"type="button" ng-click="assignShifts(tab)">Assign</button>
			</div>
			<br>
			<br>
			<br>
			<div hidden class = "scheduleOptions">
				<div style="horizontal-align:right;" class = "scheduleOptions">
				    <label style="font-size:38px">Allow overtime</label>
				    <input type="checkbox" style="height:40px;width:40px" ng-model="allowOvertime">
			    </div>
			    <br>
			    <div class = "scheduleOptions">
				    <label style="font-size:38px">Use daily shift maximum</label>
				    <input type="checkbox" style="height:40px;width:40px" ng-model="useDailyMax">
			    </div>
			    <br>
			    <div class = "scheduleOptions">
				    <label style="font-size:38px">Use weekly work day maximum</label>
				    <input type="checkbox" style="height:40px;width:40px" ng-model="useWeeklyMax">
			    </div>
			    <br>
			    <div class = "scheduleOptions">
				    <label style="font-size:38px">Prioritize second Shift</label>
				    <input type="checkbox" style="height:40px;width:40px" ng-model="prioritizeSecondShift">
			    </div>
			    <br>
			    <div class = "scheduleOptions">
				    <label style="font-size:38px">Allow unavailable</label>
				    <input type="checkbox" style="height:40px;width:40px" ng-model="allowUnavailable">
			    </div>
			    <br>
				<div class = "scheduleOptions">
				    <label style="font-size:38px">Allow inactive</label>
				    <input type="checkbox" style="height:40px;width:40px" ng-model="allowInactive">
			    </div>
		    </div>
	    	<br>
			<br>
			<br>
			<br>
			<br>
			<div class="centered">
				<button class="deleteButton scheduleButton" ng-class="{ disabled: !isGenerated(tab) || isAssigning(tab) }" type="button" ng-click="deleteShifts(tab)">Delete</button>
			</div>
		 <div>
    </div>
    <script type="text/javascript" src="js/page/schedulerPage.js"></script>
</div>
