<div ng-controller="MobileEmployeeController" ng-init="listEmployees()">
	<div style="display:inline-block;width:100%">
	 	<div style="display:inline-block;width:25%">
			<ul>
				<div class = "newEmployeeTab">
			    	<div >
			       		<p ng-click="newEmployee()"><span class="glyphicon glyphicon-plus" style="position:static !important"></span>&nbsp;New Employee</p>
			    	</div>
		    	</div>
				<div style="overflow-y:auto;height:80vh" class="monthSelector">
					<div ng-repeat="employee in employees" ng-init="setEmployee(employees[0])">
						<div class = "employeeTab" ng-class="{ active: isEmployeeSet(employee) }">
					    	<div>
					       		<p ng-click="setEmployee(employee)">{{employee.first}} {{employee.initial}}</p>
					    	</div>
				    	</div>
			    	</div>
		    	</div>
	    	</ul>
	   	</div>
	   	<div ng-if="isEmployeeSet(employee)" style="display:inline-block; vertical-align: top; width:72%;height:82vh">
			<div style="width:100%;text-align: center;">
				<div style="display:inline-block" class = "recTab" ng-class="{ active: isSet('Schedule') }">
			    	<div >
			       		<p ng-click="setTab('Schedule')">Schedule</p>
			    	</div>
		    	</div>
		    	<div style="display:inline-block;" class = "recTab" ng-class="{ active: isSet('Requests') }">
			    	<div >
			       		<p ng-click="setTab('Requests')">Requests</p>
			    	</div>
		    	</div>
		    	<div style="display:inline-block;" class = "recTab" ng-class="{ active: isSet('Details') }">
			    	<div >
			       		<p ng-click="setTab('Details')">Details</p>
			    	</div>
		    	</div>
	    	</div>
	    	<br>
	    	<div ng-if="isSet('Schedule')" style="width:100%">
	    		<div>
	    			<div style="width:100%">
	    				<div class="inline" style="margin-left:32%;width:40%;text-align: center;">
		    				<div class = 'inline centered'>
					    		<div>
						    		<h1 class = 'centered'>{{monthName}}  {{year}}</h1>
					    		</div>
					    		<div>
						    		<button class="inline" ng-click="decrementWeek()"><span class="changeWeek glyphicon glyphicon-chevron-left"></span></button>
						    		<h2 class = 'inline centered' style="width:140px">{{displayWeek}}</h2>
						    		<button class="inline" ng-click="incrementWeek()"><span class="changeWeek glyphicon glyphicon-chevron-right"></span></button>
					    		</div>
				    		</div>
			    		</div>
   			    		<button  class="inline rightAlign newShiftButton" ng-click="addShift(employee)"><span class="glyphicon glyphicon-plus"></span>&nbsp;New Shift</button>
		    		</div>
		 			<div style="overflow-y:auto;height:70vh;">
   						<div ng-repeat="day in displayDays">
				    		<h4 class='weekDay rightAlign'>{{day}}</h4>
				    		<div ng-repeat="shift in shifts">
				    			<div ng-if="isDay(shift,day,displayWeek)" class = "shift">
				    				<span ng-init="setShiftDisplay(shift)">{{shift.display}}</span>
									<span ng-click="editShift(shift,employee,clients)" style="display:inline-block;width:94%" ng-init="getShiftDisplayValue(shift)">{{shift.displayValue}}</span>
									<span ng-click="deleteShift(shift)" style="display:inline-block;float:right" class="glyphicon inline red trash glyphicon-trash"></span>
								</div>
							</div>
						</div>
   					</div>
	    		</div>
	    	</div>
	    	<div overflow-y:auto; ng-if="isSet('Requests')">
	    		
	    	</div>
	    	<div ng-if="isSet('Details')" class = 'rightAlign'>
	    		<form name="employeeForm" ng-init="listCustomFields()" role="form" style="overflow-y:auto;height:80vh;margin-right:3%">
			        <div>
			            <label for="first" class="inline" style="font-size:38px">First</label>
			            <input ng-change="setDetailsToChanged()" type="text" class="form-control inline input-large rightAlign nameInput" id="first" name="first" required ng-model="employee.first">
			        </div>
			        
			        <div>
			            <label for="initial" class="inline" style="font-size:38px">Initial</label>
			            <input ng-change="setDetailsToChanged()" type="text" class="inline form-control input-large rightAlign nameInput" id="initial" name="initial" required ng-model="employee.initial">
			        </div>

				    <div ng-if="customFieldDataEditing">
				        <div ng-repeat="customField in customFields">
			            	<div ng-init="getEmployeeCustomFieldData(employee,customField,$index)">
			            		<label for="customField" style="font-size:38px">{{customField.employeeVariable}}</label>
			            		<input ng-change="setDetailsToChanged()" type="checkbox" id="customField" name="customField" style="height:20px;width:20px" ng-model="customValue[$index]">
			            	</div>
				        </div>
			        </div>
       			    <div style="float:right" class="rightAlign">
					    <button ng-if="isEmployeeChangeValid(employee)"  class="rightAlign inline okEmployeeButton" ng-click="ok()" >OK</button>
					    <button ng-if="isEmployeeChangeValid(employee)" class="rightAlign  inline cancelEmployeeButton" style="margin-left:10px" ng-click="cancel()">Cancel</button>
				    </div>
				    
	  			    <button class="deleteEmployeeButton" ng-click="delete()" >Delete</button>
			    </form>
	    	</div>
		 </div>
    </div>
    
    <script type="text/javascript" src="js/modal/ShiftModalController.js"></script>
    <script type="text/javascript" src="js/modal/EmployeeModalController.js"></script>
