<div style="width:80%;margin-left:10%" ng-controller="VacationController"  ng-init="listEmployees()">
  <form name="myForm">
    <label for="mySelect" style="font-size:18px">Select an employee for call offs:</label>
    <select name="mySelect" id="mySelect"
     	ng-options='employee.first for employee in employees | orderBy:"first" track by employee.id'
	    ng-model="selectedEmployee"
	    ng-value="{{employee.first}}">
    </select>
  </form>
  
  </br>
  
  <div ng-if="selectedEmployee">
	  <h3>Days requested off for {{selectedEmployee.first}} {{selectedEmployee.initial}}</tth3><br/>
	  </br>
	     <ul ng-repeat="requestedDay in selectedEmployee.requestedOff track by $index">
	         <li>
	           <form>
      	        <div style="display:inline-block">
	           		<span>{{requestedDay}}</span>
	           	</div>
   		        <div style="display:inline-block">
		           	<a href="" ng-click="removeAbsence(selectedEmployee,requestedDay)">
		           		<div style="display:inline-block">
		           			<span class="glyphicon glyphicon-minus"></span>
		           		</div>
		           		<div style="display:inline-block">
		           			<span>remove date</span>
		           		</div>
		           	</a>
	           </form>
	         </li>
	     </ul>
	     
	     </br>
	     
	  <form ng-submit="addAbsence(newDate)">
	           <label>Date:</label>
	           <input type="date" ng-model="newDate" placeholder="Date" ng-required/>
	           <a href="" ng-click="addAbsence(selectedEmployee,newDate)"><span class="glyphicon glyphicon-plus"></span>add date</a>
	      </form>
	   </div>
	   
    <script type="text/javascript" src="js/page/vacationPage.js"></script>
</div>
