<div id="adminView" ng-init="init()">
 	<div class="head" style="margin-bottom:0px !important">
	 	<div style="display:inline-block;text-align:right">
	          <p style="display:inline-block"  class="titleText" ng-click="setPage('employee')">Accessible Scheduling</p>
	    </div>
	    <div ng-if="!loggedIn()"  style="float:right;margin-right:20px;margin-top:15px;display:inline-block;margin-top: 15px;"> 
	    		<div class="g-signin2" style="font-size:14px" data-onsuccess="onSignIn" data-theme="dark"></div>
	    </div>
        <div style="display:inline-block;float:right;margin-top:7px!important;">
        	<div  ng-if="manager" class="navAllign" ng-click="setPage('client')">
       			<i class="centered glyphicon glyphicon-user"/>
       			<br>
       			<span class="centered">Clients</span>
          	</div>
          	<div ng-if="user" style="margin-left: 4px;" class="navAllign" ng-click="setPage('employee')">
       			<i class="centered  glyphicon glyphicon-plus-sign"/>
       			<br>
       			<span class="centered">Staff</span>
          	</div>
          	<div ng-if="admin" class="navAllign" ng-click="setPage('scheduler')">
       			<i  class="centered glyphicon glyphicon-dashboard " />
       			<br>
       			<span class="centered">Scheduler</span>
          	</div>
			<div ng-if="admin" class="navAllign" ng-click="setPage('alerts')">
       			<i  class="centered glyphicon glyphicon-bell"/>
       			<br>
       			<span class="centered">Alerts</span>
          	</div>
			<div ng-if="admin" class="navAllign" ng-click="setPage('settings')">
       			<i  class="centered glyphicon glyphicon-cog"/>
       			<br>
       			<span class="centered">Settings</span>
          	</div>
  			<div  ng-if="loggedIn()" class="navAllign" ng-click="signOut();setPage('splash');">
       			<i class="glyphicon glyphicon-log-out"/>
       			<br>
       			<span class="centered">Sign out</span>
          	</div>
       	</div>
    </div>
    <div class="row">
       <div  style="margin-bottom:-75px;" ng-if="showToast" ng-click="hideToast()" class="toast centered alert" ng-class="{'alert-success': !alertError, 'alert-danger': alertError}"">
       		<p>{{alertMessage}}</p>
       </div>
    </div>

    <div class="row multi-columns-row">
        <div ng-include src="page"></div>
    </div>
    <meta name="google-signin-scope" content="profile email">
    <meta name="google-signin-client_id" content="728962972693-5uudecgh1ir6if7imo2hb6cv9qa9nrk3.apps.googleusercontent.com">
    <!--<meta name="google-signin-client_id" content="728962972693-5uudecgh1ir6if7imo2hb6cv9qa9nrk3.apps.googleusercontent.com">-->
	<script src="https://apis.google.com/js/platform.js" async defer></script>
    <script type="text/javascript" src="js/page/loginPage.js"></script>
</div>
