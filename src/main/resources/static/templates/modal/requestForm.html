<div class="modal-header">
    <h3 ng-show="shiftRequestAction === 'add'">Add a Request</h3>
    <h3 ng-show="shiftRequestAction === 'update'">Edit a Request</h3>
</div>

<div class="modal-body">
    <form name="requestForm" role="form">
        <div ng-if="selectedClient">
    	    <label for="clientName" style="font-size:25px">Client Name:</label>
    	    <label for="clientName" style="font-size:23px">{{selectedClient.first}}</label>
        </div>
        
        <div>
            <label for="fixedStaff" style="font-size:25px">Request Staff Member</label>
            <input ng-change="isValid(shiftRequest)" ng-click="selectedEmployee = null" type="checkbox" id="fixedStaff" name="fixedStaff" style="height:20px;width:20px"  ng-model="shiftRequest.requestEmployee">
        </div>
        
        <div ng-if="shiftRequest.requestEmployee" class="form-group has-feedback" ng-class="{'has-warning': recurringShiftNeedForm.staffName.$invalid, 'has-success': recurringShiftNeedForm.staffName.$valid}">
            <label for="staffName" style="font-size:25px">Staff Name</label>
            
            <select name="mySelect" 
            		id="mySelect"
            		style="font-size:23px"
            		ng-change="isValid(shiftRequest)"
            		ng-init = "selectedEmployee"
      				ng-options="employee.first for employee in employees | orderBy:'first' track by employee.id"
      				ng-model="selectedEmployee"
      				ng-value="{{employee.first}}">
      			{{employee.first}}
      		</select>
      				
            <input type="text" ng-hide="true" id="staffId" name="staffId" ng-model="shiftRequest.staffId" ng-value="shiftRequest.staffId=selectedEmployee.id">
            <input type="text" ng-hide="true" id="staffName" name="staffName" ng-model="shiftRequest.staffName" ng-value="shiftRequest.staffName=selectedEmployee.first">
        </div>
        
        <div ng-if="shiftRequest.staffId || shiftRequestAction==='update' || !shiftRequest.requestEmployee">
	        <div>
	            <label for="startDate" style="font-size:25px">Start Date/Time</label>
	            <input style="font-size:23px" ng-change="isValid(shiftRequest)" type="date" ng-model="shiftRequest.startDate" placeholder="Date" ng-required/>
	            <input style="font-size:23px" ng-change="isValid(shiftRequest)" type="time" ng-model="shiftRequest.startTime">
	        </div>
	        
	        <div>
	            <label for="endDate" style="font-size:25px">End Date/Time</label>
	            <input style="font-size:23px" ng-change="isValid(shiftRequest)" type="date" ng-model="shiftRequest.endDate" placeholder="Date" ng-required/>
	            <input style="font-size:23px" ng-change="isValid(shiftRequest)" type="time" ng-model="shiftRequest.endTime">
	        </div>
	        <br>
	        <div ng-if="shiftRequest.startDate">
   	            <label style="font-size:25px">Repetition</label>
   	            <br>
  	           	<label style="font-size:23px">Repeats every</label>
   	            <input type="checkbox" style="height:20px;width:20px"  ng-model="shiftRequest.repeats">
   	            <input style="width:50px;font-size:21px'" type="number" name="every" min="1" ng-model="shiftRequest.repeatsEvery">
   	            
			    <form name="myForm" style="display:inline-block" >
		    		<select style="display:inline-block; font-size:23px"
				      		ng-model="selectedInterval"
				      		ng-init="selectedInterval"
				      		ng-value="{{selectedInterval}}">
					    <option value=days>Day(s)</option>
					    <option value=weeks>Week(s)</option>
				        <option value=months>Month(s)</option>
			            <option value=years>Year(s)</option>
	          		</select>
			  	</form>
			  	<br>
   	            
   	            <div ng-if="shiftRequest.repeats">
   	            <br>
   	            <div ng-if="everyWeek(selectedInterval)">
   	            	<div class="daySelector">
						<label for="sunday" style="font-size:15px">Sun</label>
						<br>
						<input class="dayCheckbox" type="checkbox" ng-model="everySunday">
					</div>
					<div class="daySelector">
						<label for="monday" style="font-size:15px;text-align:center">Mon</label>
						<br>
						<input class="dayCheckbox" type="checkbox" ng-model="everyMonday">
					</div>
					<div class="daySelector">
						<label for="monday" style="font-size:15px;text-align:center">Tues</label>
						<br>
						<input class="dayCheckbox"  type="checkbox" ng-model="everyTuesday">
					</div>
					<div class="daySelector">
						<label for="monday" style="font-size:15px;text-align:center">Wed</label>
						<br>
						<input class="dayCheckbox"  type="checkbox" ng-model="everyWednesday">
					</div>
					<div class="daySelector">
						<label for="monday" style="font-size:15px;text-align:center">Thurs</label>
						<br>
						<input class="dayCheckbox" type="checkbox" ng-model="everyThursday">
					</div>
					<div class="daySelector">
						<label for="monday" style="font-size:15px;text-align:center">Fri</label>
						<br>
						<input class="dayCheckbox"  type="checkbox" ng-model="everyFriday">
					</div>
					<div class="daySelector">
						<label for="monday" style="font-size:15px;text-align:center">Sat</label>
						<br>
						<input class="dayCheckbox"  type="checkbox" ng-model="everySaturday">
					</div>
					<br>
   	            </div>
   	            <div ng-if="everyMonth(selectedInterval)">
				  	<form name="myForm" style="display:inline-block" >
			    		<select style="display:inline-block; font-size:23px"
					      		ng-model="selectedInterval2"
					      		ng-init="selectedInterval2"
					      		ng-value="{{selectedInterval2}}">
						    <option value=days>Every {{shiftRequest.repeatsEvery}} month(s) on day {{dayOfMonth}} </option>
						    <option value=weeks>Every {{shiftRequest.repeatsEvery}} month(s) on {{dayOfWeek}} of week {{weekOfMonth}}</option>
		          		</select>
				  	</form>
				  	<br>
   	            </div>
   	             <div ng-if="everyYear(selectedInterval)">
		    		<form name="myForm" style="display:inline-block" >
			    		<select style="display:inline-block; font-size:23px"
					      		ng-model="selectedInterval3"
					      		ng-init="selectedInterval3"
					      		ng-value="{{selectedInterval3}}">
						    <option value=days>Every {{shiftRequest.repeatsEvery}} year(s) in {{monthName}} on day {{dayOfMonth}}</option>
						    <option value=weeks>Every {{shiftRequest.repeatsEvery}} year(s) in  {{monthName}} on {{dayOfWeek}} of week {{weekOfMonth}}</option>
		          		</select>
				  	</form>
				  	<br>
   	            </div>
   	            <br>
   	            	<label style="font-size:25px">Exceptions</label>
				  </br>
				   <form ng-submit="addException(newDate)">
				           <label style="font-size:25px">Date:</label>
				           <input style="font-size:23px" type="date" ng-model="newDate" placeholder="Date" ng-required/>
				           <a style="font-size:23px" href="" ng-click="addException(newDate)"><span class="glyphicon glyphicon-plus"></span>add date</a>
			      </form>
			      <br>
				  <div style="height:200px; overflow-y:auto">
				     <ul ng-repeat="exception in shiftRequest.exceptions track by $index">
				         <li>
				           <form>
			      	        <div style="display:inline-block">
				           		<span style="font-size:23px">{{exception}}</span>
				           	</div>
			   		        <div style="display:inline-block">
					           	<a href="" ng-click="removeException(exception)">
					           		<div style="display:inline-block">
					           			<span class="glyphicon glyphicon-minus"></span>
					           		</div>
					           		<div style="display:inline-block">
					           			<span style="font-size:21px">remove exception</span>
					           		</div>
					           	</a>
				           </form>
				         </li>
				     </ul>
				  </div>
				  </br>
				     
				 
			   </div>
	        </div>
        </div>
    </form>
</div>

<div class="modal-footer">
    <button class="btn btn-primary btn-md active" ng-show="valid" ng-click="ok()" >OK</button>
    <button class="btn btn-warning btn-md active" ng-click="cancel()">Cancel</button>
</div>
